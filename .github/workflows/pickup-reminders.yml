name: Vula booking reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vula-booking-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the protected Vula reminder endpoint
        env:
          VULA_REMINDER_CRON_SECRET: ${{ secrets.VULA_REMINDER_CRON_SECRET }}
          VULA_PUBLIC_URL: ${{ secrets.VULA_PUBLIC_URL }}
        run: |
          if [ -z "$VULA_REMINDER_CRON_SECRET" ] || [ -z "$VULA_PUBLIC_URL" ]; then
            echo "Vula reminders are not configured yet; skipping this scheduled run."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $VULA_REMINDER_CRON_SECRET" \
            "$VULA_PUBLIC_URL/api/notifications/reminders"
