name: Repair racing dependency lock and verify install

on:
  push:
    branches:
      - fix/three-lockfile-install-verification

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lock from the existing manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit corrected lockfile without changing game dependencies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches package.json"
          else
            git commit -m "fix: sync racing game dependencies in lockfile"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Clean install from corrected lockfile
        run: npm ci
      - name: Verify project identity and PWA assets
        run: npm run verify:identity
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
